<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יום הזיכרון — jeu de vocabulaire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #0d0600;
    --bg2: #160c02;
    --bg3: #1e1105;
    --amber: #c97c1a;
    --amber-light: #e8a23a;
    --amber-pale: #f5d090;
    --text: #f0e0c0;
    --text-muted: #9a7a50;
    --text-dim: #5a4020;
    --gold: #d4a030;
    --success: #4a9e6a;
    --danger: #c04040;
    --border: rgba(200,130,30,0.18);
    --border-strong: rgba(200,130,30,0.38);
    --card: rgba(30,17,5,0.95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Spectral', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 0 1.5rem 4rem; }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    margin: 0 -1.5rem 2.5rem;
    overflow: hidden;
    border-bottom: 1px solid var(--border-strong);
  }
  .hero-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: center;
    display: block;
    filter: brightness(0.55) saturate(0.7);
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to left, rgba(13,6,0,0.1) 0%, rgba(13,6,0,0.7) 100%);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 2.5rem;
  }
  .hero-copy { text-align: right; }
  .hero-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    letter-spacing: 0.02em;
  }
  .hero-sub {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1rem;
    color: var(--amber-pale);
    line-height: 1.8;
    margin-top: 4px;
    opacity: 0.9;
  }
  .flame-left {
    position: absolute;
    left: 3rem;
    bottom: 0.5rem;
    opacity: 0.85;
  }

  /* ===== SCORE BAR ===== */
  .scorebar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 1.75rem;
    padding: 10px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .score-pill {
    font-family: 'Spectral', serif;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .score-pill strong {
    color: var(--amber-light);
    font-weight: 600;
  }
  .progress { flex: 1; height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--amber); border-radius: 2px; transition: width 0.5s ease; }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    flex-wrap: wrap;
  }
  .tab {
    padding: 7px 18px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 15px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { border-color: var(--amber); color: var(--amber-pale); }
  .tab.active {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--bg);
    font-weight: 700;
  }

  /* ===== VOCAB ===== */
  .section-label {
    font-family: 'Spectral', serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .vcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .vcard::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 80% 20%, rgba(200,130,30,0.07) 0%, transparent 70%);
  }
  .vcard:hover { border-color: var(--amber); transform: translateY(-2px); }
  .vcard.revealed { border-color: rgba(200,130,30,0.5); }
  .vcard-he {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    text-align: right;
    margin-bottom: 3px;
  }
  .vcard-root {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 12px;
    color: var(--amber);
    text-align: right;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .vcard-fr {
    font-family: 'Spectral', serif;
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.5;
    display: none;
    direction: rtl;
  }
  .vcard.revealed .vcard-fr { display: block; }
  .vcard-hint {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 8px;
    font-style: italic;
  }
  .vcard.revealed .vcard-hint { display: none; }

  /* ===== SENTENCES ===== */
  .scard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.1rem;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .scard::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border-strong);
    transition: background 0.3s;
  }
  .scard.solved { border-color: rgba(74,158,106,0.4); }
  .scard.solved::before { background: var(--success); }
  .scard.wrong { border-color: rgba(192,64,64,0.4); animation: shake 0.35s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

  .scard-num {
    font-family: 'Spectral', serif;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }
  .scard-he {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    direction: rtl;
    text-align: right;
    line-height: 2;
    color: var(--text);
    margin-bottom: 6px;
  }
  .blank-slot {
    display: inline-block;
    min-width: 90px;
    height: 28px;
    border-bottom: 2px solid var(--amber);
    vertical-align: middle;
    margin: 0 6px;
    position: relative;
  }
  .blank-filled {
    display: inline-block;
    padding: 2px 12px;
    border-bottom: 2px solid var(--amber-light);
    color: var(--amber-light);
    font-weight: 700;
    vertical-align: middle;
    margin: 0 6px;
    cursor: pointer;
    border-radius: 3px 3px 0 0;
    background: rgba(200,130,30,0.08);
  }
  .blank-correct {
    display: inline-block;
    padding: 2px 12px;
    border-bottom: 2px solid var(--success);
    color: #6fca8a;
    font-weight: 700;
    vertical-align: middle;
    margin: 0 6px;
    border-radius: 3px 3px 0 0;
    background: rgba(74,158,106,0.12);
  }
  .scard-fr {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--text-muted);
    text-align: right;
    margin-bottom: 14px;
    direction: ltr;
    text-align: left;
  }
  .tiles-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    direction: rtl;
    margin-top: 12px;
  }
  .tile {
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 16px;
    cursor: pointer;
    background: var(--bg2);
    color: var(--text);
    transition: all 0.15s;
    direction: rtl;
  }
  .tile:hover { border-color: var(--amber); color: var(--amber-pale); }
  .tile.sel { background: var(--amber); border-color: var(--amber); color: var(--bg); font-weight: 700; }
  .tile.t-ok { background: rgba(74,158,106,0.2); border-color: var(--success); color: #6fca8a; pointer-events: none; }
  .tile.t-ko { background: rgba(192,64,64,0.15); border-color: var(--danger); color: #e07070; pointer-events: none; }
  .tile.used { opacity: 0.2; pointer-events: none; }

  .check-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 22px;
    background: var(--amber);
    border: none;
    border-radius: 6px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 15px;
    color: var(--bg);
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.2s, transform 0.1s;
  }
  .check-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .check-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

  .feedback {
    margin-top: 10px;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'Spectral', serif;
    font-size: 13px;
    line-height: 1.5;
    direction: ltr;
    text-align: left;
  }
  .fb-ok { background: rgba(74,158,106,0.12); border: 1px solid rgba(74,158,106,0.3); color: #6fca8a; }
  .fb-ko { background: rgba(192,64,64,0.1); border: 1px solid rgba(192,64,64,0.25); color: #e07070; }

  /* ===== STRUCTURES ===== */
  .struct-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.6rem;
    margin-bottom: 10px;
    direction: rtl;
  }
  .struct-label {
    font-family: 'Spectral', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 6px;
  }
  .struct-he {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .struct-fr {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--text-muted);
    direction: ltr;
    text-align: left;
  }

  /* ===== FLAME SVG ===== */
  .flame {
    width: 55px; height: 70px;
    filter: drop-shadow(0 0 8px rgba(220,140,20,0.5));
  }

  @keyframes flicker {
    0%,100%{transform:scaleX(1) scaleY(1) rotate(-1deg)}
    33%{transform:scaleX(0.93) scaleY(1.04) rotate(1.5deg)}
    66%{transform:scaleX(1.05) scaleY(0.97) rotate(-0.5deg)}
  }
  .flame-anim { animation: flicker 2.5s ease-in-out infinite; transform-origin: bottom center; }

  .congrats {
    text-align: center;
    padding: 2rem;
    background: var(--card);
    border: 1px solid rgba(200,130,30,0.4);
    border-radius: 10px;
    margin-top: 1.5rem;
  }
  .congrats-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.8rem;
    color: var(--amber-light);
    margin-bottom: 8px;
  }
  .congrats-fr { font-family: 'Spectral', serif; color: var(--text-muted); font-style: italic; }
</style>
</head>

      parts:["נזכור","את","כל","החללים","שנפלו","למען","המדינה"],
      correct:"שנפלו", bi:4,
      fr:"Nous nous souviendrons de tous les soldats tombés pour l'État.",
      tiles:["שנפלו","שברחו","שחיו","שהגיעו"],
      note:"משפט זיקה — relative : שׁ + passé = 'qui sont tombés'. Racine נ-פ-ל en Pa'al passé pluriel."
    },
    {
      parts:["יום","הזיכרון","חל","לפני","יום","העצמאות"],
      correct:"חל", bi:2,
      fr:"Le Jour du Souvenir tombe la veille de l'Indépendance.",
      tiles:["חל","קם","נגמר","מגיע"],
      note:"הווה יחיד — présent singulier : חָל = 'tombe sur une date'. Racine ח-ו-ל, verbe creux."
    },
    {
      parts:["בשעת","הצפירה","כולם","עומדים","דוממים"],
      correct:"עומדים", bi:3,
      fr:"Au son de la sirène, tout le monde se tient debout en silence.",
      tiles:["עומדים","יוצאים","אוכלים","רצים"],
      note:"פועל הווה רבים — présent pluriel : עוֹמְדִים = 'se tiennent debout'. Posture de recueillement."
    }
  ],
  structures: [
    {he:"תישמע צפירה",label:"עתיד סביל — passif futur",fr:"Une sirène sera entendue → sujet après le verbe, ordre VSO typique"},
    {he:"ייסגרו החנויות",label:"נפעל עתיד רבים — passif pluriel",fr:"Les commerces seront fermés → accord pluriel, préfixe יי-"},
    {he:"יהיו זכאים",label:"הבעת זכות — expression du droit",fr:"Ils auront droit à → יהיו + adjectif prédicatif"},
    {he:"יש לעצור",label:"חובה — obligation impersonnelle",fr:"Il faut s'arrêter → יש + לְ + infinitif construit"},
    {he:"שנפלו למען",label:"משפט זיקה — proposition relative",fr:"Qui sont tombés pour → שׁ + passé + préposition de but"}
  ]
};

let tab = 0;
let score = 0;
let revealed = {};
let selected = {};
let feedback = {};
let solved = {};

function totalExercises(){
  return DATA.sentences.length + DATA.vocab.length;
}

function updateScore(){
  const tot = totalExercises();
  const d = Object.keys(solved).length;
  document.getElementById('sc').textContent = score;
  document.getElementById('done').textContent = d;
  document.getElementById('total').textContent = tot;
  document.getElementById('pbar').style.width = Math.round(d/tot*100)+'%';
}

function setTab(i){
  tab=i;
  document.querySelectorAll('.tab').forEach((el,j)=>{
    el.classList.toggle('active', j===i);
  });
  render();
}

function render(){
  if(tab===0) renderVocab();
  else if(tab===1) renderSentences();
  else renderStructures();
}

function renderVocab(){
  const el = document.getElementById('content');
  let html = '<p class="section-label">לחץ על כרטיס לגילוי התרגום — cliquez pour révéler</p>';
  html += '<div class="vocab-grid">';
  DATA.vocab.forEach((v,i)=>{
    const rev = revealed[i];
    html += `<div class="vcard${rev?' revealed':''}" onclick="revealVocab(${i})">
      <div class="vcard-he">${v.he}</div>
      <div class="vcard-root">${v.root}</div>
      <div class="vcard-fr">${v.fr}</div>
      <div class="vcard-hint">לחץ לגילוי</div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function revealVocab(i){
  revealed[i]=true;
  if(!solved['v'+i]){ solved['v'+i]=true; score+=1; updateScore(); }
  render();
}

function renderSentences(){
  const el = document.getElementById('content');
  let html = '<p class="section-label">בחר את המילה הנכונה מהאריחים — choisissez le bon mot</p>';

  DATA.sentences.forEach((s,i)=>{
    const isSolved = !!solved['s'+i];
    const isWrong = feedback[i]==='ko';
    const sel = selected[i];

    // build sentence
    let sentenceHtml = '';
    s.parts.forEach((p,pi)=>{
      if(pi===s.bi){
        if(isSolved){
          sentenceHtml += `<span class="blank-correct">${s.correct}</span>`;
        } else if(sel){
          sentenceHtml += `<span class="blank-filled" onclick="clearSel(${i})">${sel} ✕</span>`;
        } else {
          sentenceHtml += `<span class="blank-slot"></span>`;
        }
      } else {
        sentenceHtml += `<span> ${p} </span>`;
      }
    });

    const tilesHtml = isSolved ? '' : `<div class="tiles-row">${s.tiles.map(t=>{
      let cls = 'tile';
      if(sel===t) cls+=' sel';
      return `<div class="${cls}" onclick="selectTile(${i},'${t}')">${t}</div>`;
    }).join('')}</div>`;

    const checkHtml = isSolved ? '' :
      `<button class="check-btn" onclick="checkSentence(${i})" ${!sel?'disabled':''}>בדוק ✓</button>`;

    let fbHtml = '';
    if(feedback[i]==='ok') fbHtml = `<div class="feedback fb-ok">✓ נכון! — ${s.note}</div>`;
    else if(feedback[i]==='ko') fbHtml = `<div class="feedback fb-ko">✗ נסה שוב — ${s.note}</div>`;

    html += `<div class="scard${isSolved?' solved':''}${isWrong?' wrong':''}" id="sc${i}">
      <div class="scard-num">${i+1} / ${DATA.sentences.length}</div>
      <div class="scard-he">${sentenceHtml}</div>
      <div class="scard-fr">${s.fr}</div>
      ${tilesHtml}${checkHtml}${fbHtml}
    </div>`;
  });

  const allDone = DATA.sentences.every((_,i)=>solved['s'+i]);
  if(allDone){
    html += `<div class="congrats">
      <div class="congrats-title">כל הכבוד! 🕯</div>
      <div class="congrats-fr">Toutes les phrases réussies — score final: <strong>${score}</strong> points</div>
    </div>`;
  }

  el.innerHTML = html;
}

function selectTile(i,t){
  selected[i] = (selected[i]===t) ? null : t;
  feedback[i] = null;
  render();
}
function clearSel(i){ selected[i]=null; feedback[i]=null; render(); }
function checkSentence(i){
  const s = DATA.sentences[i];
  if(selected[i]===s.correct){
    solved['s'+i]=true; feedback[i]='ok'; score+=3; updateScore();
  } else {
    feedback[i]='ko';
  }
  render();
}

function renderStructures(){
  const el = document.getElementById('content');
  let html = '<p class="section-label">מבנים לשוניים מרכזיים — structures grammaticales clés</p>';
  DATA.structures.forEach(s=>{
    html += `<div class="struct-card">
      <div class="struct-label">${s.label}</div>
      <div class="struct-he">${s.he}</div>
      <div class="struct-fr">${s.fr}</div>
    </div>`;
  });
  el.innerHTML = html;
}

updateScore();
render();
</script>
</body>
</html>
